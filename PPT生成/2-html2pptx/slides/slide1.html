<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #003366; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #003366; color: #ffffff;
  display: flex; flex-direction: column; box-sizing: border-box;
}
.bar { height: 6pt; background: #0078D4; }
.content { padding: 26pt 40pt 0 40pt; display: flex; flex-direction: column; flex: 1; box-sizing: border-box; }
.kicker { font-size: 11pt; color: #0078D4; font-weight: bold; margin: 0 0 12pt 0; }
h1 { font-size: 40pt; margin: 0 0 8pt 0; font-weight: bold; color: #ffffff; }
.sub { font-size: 16pt; color: #bfd4ea; margin: 0; }
.spacer { flex: 1; }
.cards { display: flex; gap: 14pt; }
.card { flex: 1; background: #0a4173; border-radius: 8pt; padding: 13pt 15pt; box-sizing: border-box; }
.num { font-size: 19pt; color: #0078D4; font-weight: bold; margin: 0 0 5pt 0; }
.ct { font-size: 12.5pt; font-weight: bold; margin: 0 0 4pt 0; color: #ffffff; }
.cd { font-size: 9.5pt; color: #bfd4ea; margin: 0; line-height: 1.35; }
.foot { font-size: 8pt; color: #7a9ac0; margin: 12pt 0 0 0; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="content">
    <p class="kicker">MELONAI · 职场AI日报 · 2026-08-02</p>
    <h1>今日三大AI要闻</h1>
    <p class="sub">打工人视角解读 —— 5分钟看懂今天该知道的 AI 大事</p>
    <div class="spacer"></div>
    <div class="cards">
      <div class="card">
        <p class="num">01</p>
        <p class="ct">国产免费反超</p>
        <p class="cd">DeepSeek-V4-Flash 正式版，干活能力接近顶级</p>
      </div>
      <div class="card">
        <p class="num">02</p>
        <p class="ct">AI 干长活立功</p>
        <p class="cd">Astra 花 $2000 连破 10 道数学世纪难题</p>
      </div>
      <div class="card">
        <p class="num">03</p>
        <p class="ct">开源登顶 · 资本大战</p>
        <p class="cd">Kimi K3 全球最大开源模型，背后估值 350 亿</p>
      </div>
    </div>
    <p class="foot">来源：官方博客 / 官方 GitHub / 官方产品站 ｜ 融资信息均标注「据媒体报道」</p>
  </div>
</body>
</html>
