<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #ffffff; color: #222222;
  display: flex; flex-direction: column; box-sizing: border-box;
}
.content { padding: 22pt 40pt 0 40pt; display: flex; flex-direction: column; box-sizing: border-box; }
.kicker { font-size: 10pt; color: #0078D4; font-weight: bold; margin: 0 0 5pt 0; }
h2 { font-size: 22pt; margin: 0 0 6pt 0; font-weight: bold; color: #003366; }
.bar { width: 56pt; height: 3pt; background: #0078D4; margin: 0 0 16pt 0; }
.view { background: #f3f2f1; border-radius: 8pt; padding: 16pt 18pt; border-left: 6pt solid #0078D4; box-sizing: border-box; margin-bottom: 14pt; }
.vh { font-size: 12pt; font-weight: bold; color: #0078D4; margin: 0 0 8pt 0; }
.vb { font-size: 13pt; line-height: 1.55; margin: 0; color: #222222; }
.act { background: #003366; border-radius: 8pt; padding: 16pt 18pt; box-sizing: border-box; }
.ah { font-size: 12pt; font-weight: bold; color: #9ec6ee; margin: 0 0 8pt 0; }
.ab { font-size: 13pt; line-height: 1.55; margin: 0; color: #ffffff; }
</style>
</head>
<body>
  <div class="content">
    <p class="kicker">TOPIC 02 · 打工人视角</p>
    <h2>AI 从「答一句」升级到「干一件长活」</h2>
    <div class="bar"></div>
    <div class="view">
      <p class="vh">一句话翻译</p>
      <p class="vb">数学难题本身离打工人远，但内核是：AI 从「答一句」升级到「独立干一件长活」。<br>以后你可以把整件工作交给 AI，而不是一句一句喂。<br>接续上一期「AI 自己干活没人盯会闯祸」——这次是「AI 干长活立了功」。</p>
    </div>
    <div class="act">
      <p class="ah">今天就能带走 · 行动</p>
      <p class="ab">把一个能拆成「交代清楚就能跑」的小任务（如让它自己调研 + 整理成报告），整件委托给 AI Agent 试一次，观察它能自主跑多久、做到什么程度。</p>
    </div>
  </div>
</body>
</html>
