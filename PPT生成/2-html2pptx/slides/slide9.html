<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #ffffff; color: #222222;
  display: flex; flex-direction: column; box-sizing: border-box;
}
.content { padding: 22pt 40pt 0 40pt; display: flex; flex-direction: column; box-sizing: border-box; }
.kicker { font-size: 10pt; color: #0078D4; font-weight: bold; margin: 0 0 5pt 0; }
h2 { font-size: 22pt; margin: 0 0 6pt 0; font-weight: bold; color: #003366; }
.bar { width: 56pt; height: 3pt; background: #0078D4; margin: 0 0 14pt 0; }
.row { display: flex; align-items: center; gap: 12pt; background: #f3f2f1; border-radius: 8pt; padding: 10pt 14pt; border-left: 6pt solid #0078D4; box-sizing: border-box; margin-bottom: 9pt; }
.tk { width: 128pt; font-size: 12pt; font-weight: bold; color: #003366; margin: 0; }
.td { flex: 1; font-size: 11pt; color: #222222; margin: 0; line-height: 1.4; }
.acth { font-size: 13pt; font-weight: bold; color: #0078D4; margin: 14pt 0 8pt 0; }
.actlist ul { margin: 0; padding-left: 16pt; }
.actlist li { font-size: 11pt; line-height: 1.55; margin-bottom: 5pt; color: #222222; }
</style>
</head>
<body>
  <div class="content">
    <p class="kicker">SUMMARY · 三句话带走</p>
    <h2>今天下班就能做</h2>
    <div class="bar"></div>
    <div class="row"><p class="tk">工具认知更新</p><p class="td">国产免费模型已具备顶级干活能力，选 AI 工具不用迷信国外付费</p></div>
    <div class="row"><p class="tk">使用方式升级</p><p class="td">AI 能独立干一整件长活了：从「一句一句喂」变成「整件委托」</p></div>
    <div class="row"><p class="tk">消费决策清醒</p><p class="td">AI 只会越来越便宜，别为焦虑买单，看懂免费背后的资本逻辑</p></div>
    <div class="actlist">
      <p class="acth">三件小事，今天下班就能做</p>
      <ul>
        <li>用 DeepSeek V4-Flash 干一件真实工作上的活，和现用工具对比</li>
        <li>把一个「交代清楚就能跑」的小任务整件委托给 AI Agent</li>
        <li>打开 Kimi 用 K3 试一个犹豫要不要付费的功能</li>
      </ul>
    </div>
  </div>
</body>
</html>
