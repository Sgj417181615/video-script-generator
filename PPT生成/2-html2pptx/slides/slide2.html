<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #ffffff; color: #222222;
  display: flex; flex-direction: column; box-sizing: border-box;
}
.content { padding: 24pt 40pt 0 40pt; display: flex; flex-direction: column; flex: 1; box-sizing: border-box; }
.kicker { font-size: 10pt; color: #0078D4; font-weight: bold; margin: 0 0 6pt 0; }
h2 { font-size: 24pt; margin: 0 0 8pt 0; font-weight: bold; color: #003366; }
.bar { width: 56pt; height: 3pt; background: #0078D4; margin: 0 0 20pt 0; }
.row { display: flex; align-items: stretch; gap: 14pt; margin-bottom: 12pt; background: #f3f2f1; border-radius: 8pt; box-sizing: border-box; }
.numblock { width: 84pt; background: #003366; border-radius: 8pt 0 0 8pt; display: flex; flex-direction: column; justify-content: center; padding: 10pt 0; box-sizing: border-box; }
.numblock p { margin: 0; text-align: center; font-size: 17pt; font-weight: bold; color: #ffffff; }
.rinner { flex: 1; padding: 9pt 14pt 9pt 0; box-sizing: border-box; }
.rt { font-size: 13.5pt; font-weight: bold; color: #003366; margin: 0 0 3pt 0; }
.rd { font-size: 10.5pt; color: #222222; margin: 0 0 3pt 0; }
.rs { font-size: 9pt; color: #595959; margin: 0; }
</style>
</head>
<body>
  <div class="content">
    <p class="kicker">AGENDA · 今日目录</p>
    <h2>今天要聊的三件大事</h2>
    <div class="bar"></div>
    <div class="row">
      <div class="numblock"><p>01</p></div>
      <div class="rinner">
        <p class="rt">DeepSeek-V4-Flash 正式版发布</p>
        <p class="rd">国产免费模型反超：顶级干活能力，几乎免费</p>
        <p class="rs">总参 284B / 激活 13B · 1M 上下文 · 单Token算力前代27%</p>
      </div>
    </div>
    <div class="row">
      <div class="numblock"><p>02</p></div>
      <div class="rinner">
        <p class="rt">OpenAI Astra 数学突破</p>
        <p class="rd">AI 花 $2000 连破 10 道数学世纪难题</p>
        <p class="rs">249 页手稿 · Lean 4 形式化验证 · next major model</p>
      </div>
    </div>
    <div class="row">
      <div class="numblock"><p>03</p></div>
      <div class="rinner">
        <p class="rt">Kimi K3 开源 + 融资</p>
        <p class="rd">全球最大开源模型免费给你用，背后公司要上市</p>
        <p class="rs">2.8T 总参 · F轮35亿美元 · 估值350亿 · 港股传闻</p>
      </div>
    </div>
  </div>
</body>
</html>
